  .paper-sheet { border: 1px solid #dce6e3; border-radius: 14px; background: #fff; padding: 18px 20px; margin-bottom: 20px; }

  .paper-head h2 { margin: 0; font-size: 19px; }

  .paper-note { margin: 10px 0 4px; font-size: 13px; color: #7a4a2c; background: #fdf6f0; border-left: 3px solid #e5c1a4; padding: 8px 10px; border-radius: 6px; line-height: 1.7; }
  .q-card { border-top: 1px solid #eef2f1; padding: 16px 0 10px; }
  .q-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: #6b7b78; }
  .q-year { background: #0f6e62; color: #fff; border-radius: 4px; padding: 1px 7px; }
  .q-year.sample { background: #b07a2a; }
  .q-stem { margin: 8px 0 6px; font-size: 15px; line-height: 1.8; white-space: pre-wrap; }
  .q-passage { margin: 8px 0 10px; padding: 12px 14px; background: #f7faf9; border: 1px solid #e6eeec; border-radius: 8px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
  .q-choices { margin: 6px 0 8px; padding-left: 2px; font-size: 14px; line-height: 1.9; color: #2f3c3a; }
  .q-choices span { display: block; }
  .q-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .q-toggle { border: 1px solid #cfdad7; background: #fff; border-radius: 8px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: inherit; }
  .q-answer { margin-top: 8px; font-size: 14px; line-height: 1.8; display: none; }
  .q-answer.show { display: block; }
  .q-answer strong { color: #0f6e62; }
  .q-topic { font-size: 12px; color: #6b7b78; }
  .empty-note { border: 1px dashed #cfdad7; border-radius: 12px; padding: 18px; color: #5b6b68; font-size: 14px; line-height: 1.8; }
